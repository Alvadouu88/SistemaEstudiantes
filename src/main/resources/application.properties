spring.application.name=SistemaEstudiantes
spring.datasource.url=jdbc:postgresql://localhost:5432/GestorEsudiantes?currentSchema=universidad
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=validate
