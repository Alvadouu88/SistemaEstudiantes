
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Gestor Estudiantes</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Enlace a tu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/estudiantes.css}">
</head>
<body class="bg-light">

<!-- Contenedor Principal Centrado -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <!-- Tarjeta de Bienvenida -->
            <div class="card shadow-sm border-0 rounded-3">

                <!-- Encabezado de la Tarjeta -->
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0 fw-bold">¡Ingreso Correcto!</h3>
                </div>

                <!-- Cuerpo con Información del Usuario -->
                <div class="card-body p-4 text-center">
                    <p class="fs-5 mb-2">
                        Usuario:
                        <strong th:text="${nombreUsuario}" class="text-primary">usuario</strong>
                    </p>

                    <p class="fs-6 text-muted mb-4">
                        Rol activo:
                        <span th:text="${rolActivo}" class="badge bg-secondary fs-6">ROL</span>
                    </p>

                    <hr class="my-4">

                    <!-- Botones de Navegación del Sistema -->
                    <h5 class="mb-3 text-secondary">Opciones del Sistema</h5>

                    <div class="d-grid gap-3">

                        <form th:action="@{/estudiantes/tabla}" method="get" class="m-0">
                            <button type="submit" class="btn btn-outline-primary btn-lg w-100">
                                Gestión de Estudiantes
                            </button>
                        </form>

                        <form th:action="@{/Docentes/tabla}" method="get" class="m-0">
                            <button type="submit" class="btn btn-outline-primary btn-lg w-100">
                                Gestión de Docentes
                            </button>
                        </form>

                        <form th:action="@{/dashboard/principal}" method="get" class="m-0">
                            <button type="submit" class="btn btn-outline-info btn-lg w-100">
                                Generar Reportes / Dashboard
                            </button>
                        </form>

                        <form th:action="@{/logout}" method="post" class="mt-2">
                            <button type="submit" class="btn btn-danger w-100">
                                Cerrar Sesión
                            </button>
                        </form>

                    </div>
                </div>

                <!-- Pie de tarjeta opcional -->
                <div class="card-footer bg-white text-center text-muted py-2 border-0">
                    <small>Sistema de Gestión Académica © 2026</small>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
