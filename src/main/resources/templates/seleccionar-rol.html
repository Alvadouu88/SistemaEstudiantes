<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar rol | Gestor Estudiantes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="role-page">

<main class="role-background">
    <div class="role-background-content d-none d-lg-block">
        <div class="brand-logo">GE</div>

        <p class="brand-label">PLATAFORMA ACADÉMICA</p>

        <h1>Gestor de<br>Estudiantes</h1>

        <p class="brand-description">
            Accede al módulo correspondiente a tu función institucional.
        </p>
    </div>
</main>

<div class="modal fade show d-block" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content role-modal border-0 shadow-lg">
            <div class="modal-body p-4 p-md-5">

                <p class="form-label-top">SELECCIÓN DE PERFIL</p>

                <h2 class="role-title">¿Cómo deseas ingresar?</h2>

                <p class="role-subtitle">
                    Hola, <strong th:text="${nombreUsuario}">usuario</strong>.
                    Selecciona el rol con el que trabajarás en esta sesión.
                </p>

                <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
                    No tienes permiso para ingresar con ese rol.
                </div>

                <form th:action="@{/seleccionar-rol}" method="post" class="mt-4">

                    <div class="role-options">
                        <label class="role-option" th:each="rol, estado : ${roles}">
                            <input type="radio"
                                   name="rol"
                                   th:value="${rol}"
                                   th:checked="${estado.first}"
                                   required>

                            <span class="role-option-content">
                                <span class="role-option-name" th:text="${rol}">
                                    ROL
                                </span>

                                <span class="role-option-description"
                                      th:if="${rol == 'ADMINISTRADOR'}">
                                    Gestiona usuarios, configuraciones y procesos generales.
                                </span>

                                <span class="role-option-description"
                                      th:if="${rol == 'DOCENTE'}">
                                    Gestiona secciones, asistencia y calificaciones.
                                </span>

                                <span class="role-option-description"
                                      th:if="${rol == 'ACADEMICO'}">
                                    Gestiona matrículas, cursos y procesos académicos.
                                </span>
                            </span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 login-button mt-4">
                        Continuar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal-backdrop fade show"></div>

</body>
</html>
