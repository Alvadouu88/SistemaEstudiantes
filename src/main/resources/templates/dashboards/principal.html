<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema de Gestión Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Panel de Control Principal</h2>
    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
    </form>
</div>

<!-- Tarjetas de Resumen / KPIs -->
<div class="row text-center mb-4">
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5>Total de Estudiantes</h5>
            <h3 th:text="${totalEstudiantes}">0</h3>
            <a th:href="@{/estudiantes}" class="btn btn-primary btn-sm mt-2">Ver Estudiantes</a>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5>Total de Docentes</h5>
            <h3 th:text="${totalDocentes}">0</h3>
            <a th:href="@{/docentes}" class="btn btn-success btn-sm mt-2">Ver Docentes</a>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3 shadow-sm fila">
            <h5>Total de Cursos</h5>
            <h3 th:text="${totalCursos}">0</h3>
            <a th:href="@{/cursos}" class="btn btn-success btn-sm mt-2">Ver Cursos</a>
        </div>
    </div>
</div>

<!-- Accesos rápidos a otras secciones de la BD -->
<div class="card p-4 shadow-sm">
    <h4>Navegación del Sistema</h4>
    <p class="text-muted">Seleccione la tabla que desea administrar:</p>
    <div class="d-flex gap-2">
        <a th:href="@{/estudiantes/promedios}" class="btn btn-outline-primary">Gestión de Alumnos</a>
        <a th:href="@{/docentes/resumen-estado}" class="btn btn-outline-success">Gestión de Docentes</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
