<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Docentes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-0">Resumen y Estado de Docentes</h2>
            <p class="text-muted small">Panel de control y seguimiento del personal docente</p>
        </div>
        <a th:href="@{/dashboard/principal}" class="btn btn-outline-secondary btn-sm fw-semibold">Regresar al Panel</a>
    </div>

    <!-- Tarjetas de Estadísticas (Resumen) -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-3 border-start border-primary border-4">
                <span class="text-muted small text-uppercase fw-bold">Total de Docentes</span>
                <h3 class="fw-bold text-primary mb-0 mt-1" th:text="${totalDocentes}">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-3 border-start border-success border-4">
                <span class="text-muted small text-uppercase fw-bold">Docentes Activos</span>
                <h3 class="fw-bold text-success mb-0 mt-1" th:text="${totalActivos}">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-3 border-start border-secondary border-4">
                <span class="text-muted small text-uppercase fw-bold">Docentes Inactivos</span>
                <h3 class="fw-bold text-secondary mb-0 mt-1" th:text="${totalInactivos}">0</h3>
            </div>
        </div>
    </div>

    <!-- Tabla de Docentes Inactivos -->
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-dark text-white p-3">
            <h5 class="mb-0 fw-bold">Listado de Docentes Inactivos</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center m-0">
                    <thead class="table-light text-uppercase fs-7">
                    <tr>
                        <th class="py-3">Código</th>
                        <th class="py-3">Nombres y Apellidos</th>
                        <th class="py-3">Correo</th>
                        <th class="py-3">Teléfono</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="doc : ${docentesInactivos}">
                        <td class="fw-bold text-secondary" th:text="${doc.codigo}"></td>
                        <td>
                            <span th:text="${doc.nombres}"></span>
                            <span th:text="${doc.apellidos}"></span>
                        </td>
                        <td th:text="${doc.correo != null ? doc.correo : 'Sin correo'}"></td>
                        <td th:text="${doc.telefono != null ? doc.telefono : 'Sin teléfono'}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(docentesInactivos)}">
                        <td colspan="4" class="text-center text-muted py-4">
                            No hay docentes inactivos registrados actualmente.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
