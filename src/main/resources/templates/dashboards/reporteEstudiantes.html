<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos con Promedio Bajo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Contenedor Principal -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <!-- Tarjeta de Contenido -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">

                <!-- Encabezado de la tarjeta -->
                <div class="card-header bg-danger text-white p-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-0 fw-bold">Alumnos en Riesgo Académico</h3>
                        <p class="mb-0 text-white-50 small">Estudiantes con promedio ponderado menor a 12</p>
                    </div>
                    <a th:href="@{/dashboard/principal}" class="btn btn-light btn-sm fw-semibold">Regresar al Panel</a>
                </div>

                <!-- Cuerpo de la Tarjeta (Tabla) -->
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center m-0">
                            <thead class="table-dark text-uppercase fs-7">
                            <tr>
                                <th class="py-3">Código</th>
                                <th class="py-3">Nombres</th>
                                <th class="py-3">Apellidos</th>
                                <th class="py-3">Promedio</th>
                                <th class="py-3">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="est : ${promedios}">
                                <td class="fw-bold text-secondary" th:text="${est.codigo}"></td>
                                <td th:text="${est.nombres}"></td>
                                <td th:text="${est.apellidos}"></td>
                                <td>
                                    <!-- Badge de Bootstrap para resaltar la nota baja -->
                                    <span class="badge bg-danger bg-opacity-10 text-danger border border-danger px-3 py-2 fs-6"
                                          th:text="${#numbers.formatDecimal(est.promedioCalculado, 1, 2)}">
                                            </span>
                                </td>
                                <td>
                                    <div class="d-flex justify-content-center align-items-center gap-2">
                                        <button type="button" class="btn btn-outline-primary btn-sm">
                                            Ver Detalles
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <!-- Mensaje si no hay registros -->
                            <tr th:if="${#lists.isEmpty(promedios)}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    ¡Excelente! No hay alumnos registrados con promedio menor a 12.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
