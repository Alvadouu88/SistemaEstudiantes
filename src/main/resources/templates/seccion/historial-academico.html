<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Académico</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <!-- Tarjeta de Encabezado -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold text-primary mb-1">
                    <i class="fa-solid fa-graduation-cap me-2"></i>Historial Académico
                </h2>
                <p class="text-muted mb-0">
                    Estudiante: <span class="fw-semibold text-dark" th:text="${estudiante.nombres + ' ' + estudiante.apellidos}">Nombre</span>
                </p>
            </div>
            <div>
                <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i> Volver
                </a>
            </div>
        </div>
    </div>

    <!-- Filtros de Ciclo o Curso -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" class="row g-3 align-items-center">
                <div class="col-md-5">
                    <label for="filtroCurso" class="form-label fw-semibold text-secondary">Filtrar por Curso</label>
                    <input type="text" id="filtroCurso" name="curso" class="form-control" placeholder="Ej. Matemáticas...">
                </div>
                <div class="col-md-4">
                    <label for="filtroCiclo" class="form-label fw-semibold text-secondary">Filtrar por Ciclo</label>
                    <input type="text" id="filtroCiclo" name="ciclo" class="form-control" placeholder="Ej. Ciclo III...">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100 me-2">
                        <i class="fa-solid fa-filter me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/historial/{id}(id=${estudiante.id})}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-rotate-right"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Calificaciones con Nombre del Curso -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="py-3 ps-4">Ciclo</th>
                        <th class="py-3">Curso</th>
                        <th class="py-3">Evaluación</th>
                        <th class="py-3 text-center">Nota</th>
                        <th class="py-3 text-center">Peso (%)</th>
                        <th class="py-3 text-end pe-4">Puntaje Parcial</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${historial.detalles}">
                        <td class="ps-4 fw-semibold text-muted" th:text="${item.ciclo}">III</td>
                        <td class="fw-bold text-dark" th:text="${item.nombreCurso}">Matemática I</td>
                        <td>
                            <span class="badge bg-secondary me-1" th:text="${item.codigoEvaluacion}">PC1</span>
                            <span th:text="${item.nombreEvaluacion}">Práctica Calificada 1</span>
                        </td>
                        <td class="text-center fw-bold" th:text="${item.nota}">16.50</td>
                        <td class="text-center text-muted" th:text="${item.pesoPorcentaje + '%'}">20.00%</td>
                        <td class="text-end pe-4 fw-semibold text-success" th:text="${item.puntajeParcial}">3.30</td>
                    </tr>
                    </tbody>
                    <tfoot class="table-group-divider">
                    <tr class="table-light">
                        <td colspan="5" class="text-end py-3 fw-bold fs-5">Nota Final Acumulada:</td>
                        <td class="text-end pe-4 py-3 fs-5 text-primary">
                            <strong th:text="${historial.notaFinalAcumulada}">15.00</strong>
                        </td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
